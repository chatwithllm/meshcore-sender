  description: Clear the companion login session. This does not revoke the remote ACL. Optionally forget the saved credential.
  fields:
    target:
      name: Repeater
      description: Exact name or unambiguous public key prefix of at least 12 characters.
      required: true
      example: ab208ae4456d
      selector:
        text:
    entry_id:
      name: MeshCore connection
      selector:
        config_entry:
          integration: meshcore_sender
    timeout:
      name: Transaction timeout
      description: Total time including an optional login. No automatic retries.
      default: 20
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: s
          mode: box
    forget_password:
      name: Forget saved credential
      default: false
      selector:
        boolean:
