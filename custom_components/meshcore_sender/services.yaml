start_range_test:
  name: Start range test
  description: Start repeated pings to one or more contacts or channels.
  fields:
    entry_id:
      name: Server
      selector:
        config_entry:
          integration: meshcore_sender
    targets:
      name: Targets
      description: Destination IDs from the server, such as dm:OptimusPrime or chan:1.
      required: true
      selector:
        text:
          multiple: true
    interval:
      name: Interval
      default: 30
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s
          mode: box
    prefix:
      name: Message prefix
      default: ping
      selector:
        text:
stop_range_test:
  name: Stop range test
  description: Stop the current range test.
  fields:
    entry_id:
      name: Server
      selector:
        config_entry:
          integration: meshcore_sender
send_message:
  name: Send message
  description: Send a message to one or more MeshCore destination IDs.
  fields:
    entry_id:
      name: Server
      selector:
        config_entry:
          integration: meshcore_sender
    targets:
      name: Targets
      required: true
      selector:
        text:
          multiple: true
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true

remote_status:
  name: Remote status
  description: Request live battery, uptime, queue and radio statistics. Manual refresh only.
  fields:
    target:
      name: Repeater
      description: Exact name or unambiguous public key prefix of at least 12 characters.
      required: true
      example: ab208ae4456d
      selector:
        text:
    entry_id:
      name: MeshCore connection
      selector:
        config_entry:
          integration: meshcore_sender
    timeout:
      name: Transaction timeout
      description: Total time including an optional login. No automatic retries.
      default: 20
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: s
          mode: box
    password:
      name: Repeater password
      description: Optional explicit password; otherwise a saved credential is used. HA action traces may retain submitted action data.
      selector:
        text:
          type: password
remote_telemetry:
  name: Remote telemetry
  description: Request advertised sensor readings without inventing unsupported measurements.
  fields:
    target:
      name: Repeater
      description: Exact name or unambiguous public key prefix of at least 12 characters.
