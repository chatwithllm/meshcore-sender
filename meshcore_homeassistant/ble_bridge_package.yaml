# Package for a dedicated ESPHome BLE bridge; retain the device's Wi-Fi/API/OTA.
# Remove bluetooth_proxy from the device configuration before including this.
external_components:
  - source:
      type: git
      url: https://github.com/matthew73210/meshcore-ble-bridge
      # Preserve each companion command as one BLE write (fixes truncated messages).
      ref: db6bfdef4681294bf6439d0d001e8dfeb430b556
    components: [meshcore_ble_bridge]

esp32_ble:
  io_capability: keyboard_only

esp32_ble_tracker:

globals:
  - id: runtime_meshcore_pin
    type: uint32_t
    restore_value: true
    initial_value: '1000000'

api:
  actions:
    - action: update_meshcore_pin
      supports_response: status
      variables:
        password: string
      then:
        - if:
            condition:
              lambda: |-
                if (password.size() != 6) return false;
                for (char c : password) if (c < '0' || c > '9') return false;
                return true;
            then:
              - globals.set:
                  id: runtime_meshcore_pin
                  value: !lambda 'return std::strtoul(password.c_str(), nullptr, 10);'
              # globals' schema declares a non-polling base; flush the restoring instance explicitly.
              - lambda: runtime_meshcore_pin->update();
              - if:
                  condition:
                    lambda: 'return global_preferences->sync();'
                  then:
                    - api.respond:
                        success: true
                    - lambda: id(meshcore_ble).set_enabled(false);
                    - delay: 2s
                    - ble_client.remove_bond:
                        id: meshcore_ble
                    - delay: 1s
                    - lambda: id(meshcore_ble).set_enabled(true);
                  else:
                    - api.respond:
                        success: false
                        error_message: "Could not save the radio PIN"
            else:
              - api.respond:
                  success: false
                  error_message: "Enter exactly six digits"

ble_client:
  - mac_address: !secret meshcore_radio_mac
    id: meshcore_ble
    auto_connect: true
    on_passkey_request:
      then:
        - if:
            condition:
              lambda: 'return id(runtime_meshcore_pin) <= 999999;'
            then:
              - ble_client.passkey_reply:
                  id: meshcore_ble
                  passkey: !lambda 'return id(runtime_meshcore_pin);'
            else:
              - ble_client.passkey_reply:
                  id: meshcore_ble
                  passkey: !secret meshcore_radio_pin

meshcore_ble_bridge:
  id: meshcore_bridge
  ble_client_id: meshcore_ble
  port: 5000
  force_encryption: true
  wait_for_auth: true
  write_with_response: true

button:
  - platform: template
    name: Repair Heltec pairing
    id: repair_meshcore_pairing
    entity_category: config
    on_press:
      then:
        - lambda: id(meshcore_ble).set_enabled(false);
        - delay: 2s
        - ble_client.remove_bond:
            id: meshcore_ble
        - delay: 1s
        - lambda: id(meshcore_ble).set_enabled(true);
